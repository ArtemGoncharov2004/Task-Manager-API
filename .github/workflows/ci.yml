name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        working-directory: src
        run: ruff check .

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: task_user
          POSTGRES_PASSWORD: change_me_locally
          POSTGRES_DB: task_manager_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U task_user -d task_manager_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: src/requirements.txt

      - name: Install dependencies
        working-directory: src
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: src
        env:
          DATABASE_URL: postgresql+asyncpg://task_user:change_me_locally@localhost:5432/task_manager_test
          TEST_DATABASE_URL: postgresql+asyncpg://task_user:change_me_locally@localhost:5432/task_manager_test
          SECRET_KEY: ci_test_secret_key_not_for_production
        run: pytest -v

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: src/htmlcov/

  docker-build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        working-directory: src
        run: docker build -t task-manager-api:ci .